
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarpPilot</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="login-screen" class="centered">
        <h2>Accès sécurisé</h2>
        <input type="password" id="password" placeholder="Mot de passe">
        <button onclick="checkPassword()">Entrer</button>
    </div>

    <div id="app" style="display:none;">
        <header><h1>MarpPilot</h1></header>
        <nav>
            <button onclick="switchTab('dashboard')">Dashboard</button>
            <button onclick="switchTab('following')">Following</button>
            <button onclick="switchTab('notes')">Notes</button>
        </nav>

        <main>
            <section id="dashboard" class="tab">
                <h2>Dashboard</h2>
                <ul id="task-list"></ul>
                <input type="text" id="new-task" placeholder="Nouvelle tâche">
                <button onclick="addTask()">Ajouter</button>
            </section>

            <section id="following" class="tab" style="display:none;">
                <h2>Following</h2>
                <select id="category-select"></select>
                <ul id="following-list"></ul>
                <input type="text" id="new-following" placeholder="Nouveau suivi">
                <button onclick="addFollowing()">Ajouter</button>
            </section>

            <section id="notes" class="tab" style="display:none;">
                <h2>Notes</h2>
                <textarea id="notes-area" placeholder="Écris ici..."></textarea>
                <button onclick="saveNotes()">Sauvegarder</button>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
